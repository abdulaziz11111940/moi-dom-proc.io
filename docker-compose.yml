# ---------------------------------------------------------------------------
# ЕИАС «Фемида» — локальный запуск
#
#   cp .env.example .env
#   docker compose up -d
#
# Портал:        http://localhost
# API:           http://localhost/api/v1
# Swagger:       http://localhost/api/v1/docs
# Keycloak:      http://localhost:8081
# MinIO консоль: http://localhost:9001
# ---------------------------------------------------------------------------

name: femida

services:
  # -------------------------------------------------------------------------
  # PostgreSQL: основные данные ЕИАС «Фемида» и отдельная база Keycloak
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: femida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-femida}
      POSTGRES_USER: ${POSTGRES_USER:-femida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD не задан}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-femida} -d ${POSTGRES_DB:-femida}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [femida]

  # -------------------------------------------------------------------------
  # Redis: кеш, rate limiting, очереди BullMQ
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: femida-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [femida]

  # -------------------------------------------------------------------------
  # MinIO: хранение документов
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: femida-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER не задан}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [femida]

  # Однократное создание приватного bucket'а
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: femida-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-femida-documents}
    entrypoint: ['/bin/sh', '/scripts/init-bucket.sh']
    volumes:
      - ./infrastructure/minio/init-bucket.sh:/scripts/init-bucket.sh:ro
    restart: 'no'
    networks: [femida]

  # -------------------------------------------------------------------------
  # Keycloak: идентификация и аутентификация
  # -------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: femida-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD не задан}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ./infrastructure/keycloak/realm-femida.json:/opt/keycloak/data/import/realm-femida.json:ro
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # В образе нет curl: используется встроенный клиент Java.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [femida]

  # -------------------------------------------------------------------------
  # Backend ЕИАС «Фемида»
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: femida-api
    restart: unless-stopped
    # Схема применяется к базе, затем выполняется идемпотентное наполнение
    # справочников и демонстрационных данных, после чего запускается сервис.
    command:
      - sh
      - -c
      - >-
        pnpm exec prisma db push --skip-generate &&
        pnpm exec ts-node prisma/seed.ts &&
        node dist/src/main.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 4000
      API_GLOBAL_PREFIX: ${API_GLOBAL_PREFIX:-api}
      API_VERSION: ${API_VERSION:-v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-femida}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-femida}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-femida-documents}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-femida}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-femida-api}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-}
      AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EKDO_SIGNING_SECRET: ${EKDO_SIGNING_SECRET:?EKDO_SIGNING_SECRET не задан}
      EKDO_SIGNING_KEY_ID: ${EKDO_SIGNING_KEY_ID:-femida-internal-v1}
      DISCORD_INTEGRATION_ENABLED: ${DISCORD_INTEGRATION_ENABLED:-false}
      DISCORD_DEFAULT_WEBHOOK_URL: ${DISCORD_DEFAULT_WEBHOOK_URL:-}
      DISCORD_TEST_WEBHOOK_URL: ${DISCORD_TEST_WEBHOOK_URL:-}
      DISCORD_FORUM_MODE: ${DISCORD_FORUM_MODE:-false}
      DISCORD_WEBHOOK_TIMEOUT_MS: ${DISCORD_WEBHOOK_TIMEOUT_MS:-10000}
      # Задачи очередей обрабатывает отдельный сервис worker.
      QUEUE_WORKER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [femida]

  # -------------------------------------------------------------------------
  # Обработчик очередей
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: femida-worker
    restart: unless-stopped
    command: ['node', 'dist/src/worker.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-femida}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-femida}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUEUE_WORKER_ENABLED: 'true'
      EKDO_SIGNING_SECRET: ${EKDO_SIGNING_SECRET:?EKDO_SIGNING_SECRET не задан}
    depends_on:
      redis:
        condition: service_healthy
    networks: [femida]

  # -------------------------------------------------------------------------
  # Frontend ЕИАС «Фемида»
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-mock}
        NEXT_PUBLIC_MAINTENANCE_MODE: ${NEXT_PUBLIC_MAINTENANCE_MODE:-false}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    container_name: femida-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: '0.0.0.0'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [femida]

  # -------------------------------------------------------------------------
  # Reverse proxy
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: femida-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [femida]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  femida:
    driver: bridge
