name: ${COMPOSE_PROJECT_NAME:-femida-test}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api-environment: &api-environment
  NODE_ENV: production
  APP_ENV: test
  API_PORT: 4000
  API_GLOBAL_PREFIX: api
  API_VERSION: v1
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: 'false'
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  KEYCLOAK_URL: http://keycloak:8080/sso
  KEYCLOAK_PUBLIC_URL: ${PUBLIC_URL}/sso
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-femida}
  KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-femida-web}
  KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-femida-api}
  KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
  AUTH_MODE: ${AUTH_MODE:?AUTH_MODE must be set to keycloak on host deployments}
  RUN_SEED: ${RUN_SEED:-false}
  CORS_ORIGINS: ${PUBLIC_URL}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EKDO_SIGNING_SECRET: ${EKDO_SIGNING_SECRET}
  EKDO_SIGNING_KEY_ID: ${EKDO_SIGNING_KEY_ID:-femida-test-v1}
  DISCORD_INTEGRATION_ENABLED: ${DISCORD_INTEGRATION_ENABLED:-false}
  DISCORD_DEFAULT_WEBHOOK_URL: ${DISCORD_DEFAULT_WEBHOOK_URL:-}
  DISCORD_TEST_WEBHOOK_URL: ${DISCORD_TEST_WEBHOOK_URL:-}
  DISCORD_FORUM_MODE: ${DISCORD_FORUM_MODE:-false}
  DISCORD_WEBHOOK_TIMEOUT_MS: ${DISCORD_WEBHOOK_TIMEOUT_MS:-10000}
  TS_NODE_COMPILER_OPTIONS: '{"module":"CommonJS","moduleResolution":"Node"}'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ['start', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HOSTNAME: ${PUBLIC_URL}/sso
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./infrastructure/keycloak/realm-femida.json:/opt/keycloak/data/import/realm-femida.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, edge]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [backend]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend]
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ['/bin/sh', '/scripts/init-bucket.sh']
    volumes:
      - ./infrastructure/minio/init-bucket.sh:/scripts/init-bucket.sh:ro
    restart: 'no'
    networks: [backend]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    command:
      - sh
      - -ec
      - >-
        pnpm exec prisma db push --skip-generate &&
        if [ "$$RUN_SEED" = "true" ]; then
          TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"Node"}'
          node -r ts-node/register -e "require('./prisma/seed.ts')";
        fi &&
        exec node dist/src/main.js
    environment:
      <<: *api-environment
      QUEUE_WORKER_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks: [backend, edge]
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    command: ['node', 'dist/src/worker.js']
    environment:
      <<: *api-environment
      QUEUE_WORKER_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api/v1
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:?AUTH_MODE must be set to keycloak on host deployments}
        NEXT_PUBLIC_MAINTENANCE_MODE: 'false'
        NEXT_PUBLIC_APP_ENV: test
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks: [edge]
    logging: *default-logging

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TEST_ACCESS_USER: ${TEST_ACCESS_USER}
      TEST_ACCESS_PASSWORD: ${TEST_ACCESS_PASSWORD}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        export TEST_ACCESS_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$TEST_ACCESS_PASSWORD")";
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge]
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge:
