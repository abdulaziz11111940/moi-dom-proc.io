user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  femida  '$remote_addr - $request_id [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

  access_log  /var/log/nginx/access.log  femida;

  sendfile        on;
  keepalive_timeout  65;
  server_tokens   off;

  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml;
  gzip_min_length 1024;

  upstream femida_web {
    server web:3000;
  }

  upstream femida_api {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    # Заголовки безопасности. CSP допускает inline-стили, которые Next.js
    # использует для внедрения критического CSS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API ЕИАС «Фемида»
    location /api/ {
      proxy_pass         http://femida_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Correlation-Id  $request_id;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 60s;
    }

    # Frontend
    location / {
      proxy_pass         http://femida_web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}
